<p class="eyebrow">Architecture · GCP</p>
<h1>Every request passes Cloud Armor and APISIX; every VM reports to the observability and Wazuh VMs</h1>
<div class="diagram-container">
<svg viewBox="0 72 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gcp-apisix-architecture-title gcp-apisix-architecture-desc">
<title id="gcp-apisix-architecture-title">GCP application platform with APISIX, observability and Wazuh</title>
<desc id="gcp-apisix-architecture-desc">API clients reach a global external Application Load Balancer protected by Cloud Armor, which forwards to Apache APISIX on private VMs; APISIX proxies straight to application containers on a second VM group; every VM sends OpenTelemetry data to an observability VM running Prometheus, Loki, Tempo and Grafana, and Wazuh agent events to a Wazuh VM; VMs read secrets from Secret Manager and pull images from Artifact Registry at boot.</desc>
