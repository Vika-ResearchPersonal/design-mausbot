<p class="eyebrow">Architecture · Trust boundary</p>
<h1>Only the execution service, in its own project, can move funds — and only after it verifies the Passkey approvals itself</h1>

<title id="binance-exec-boundary-title">Binance execution service trust boundary</title>
<desc id="binance-exec-boundary-desc">TMS in the platform project creates payment instructions over Private Service Connect; ops approve through a separate approval origin with Passkeys; the execution service in its own project verifies approvals, keeps state in Cloud SQL, reads the Binance key from Secret Manager, writes an append-only audit trail and sends the request to Binance through a static-IP egress gateway.</desc>
